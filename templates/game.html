<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vee Check</title>
<style>
:root{--bg:#0f1117;--card:#181b24;--deep:#0b0d12;--line:#2a2f3d;--text:#e8eaf0;--muted:#9aa1b2;--accent:#8b5cf6;--hot:#ec4899;--cool:#22d3ee;--good:#22c55e;--bad:#ef4444;
  --g0:#3b82f6;--g1:#f59e0b;--g2:#ec4899;--g3:#22d3ee;--g4:#a3e635;--g5:#f472b6}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;overflow-x:hidden}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:16px 20px 60px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.logo{font-weight:800;font-size:20px}.logo span{color:var(--accent)}
.stats{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:13px;flex-wrap:wrap}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap;color:inherit;font:inherit;font-size:13px}
button.pill{cursor:pointer}button.pill[aria-pressed=true]{border-color:var(--accent)}
.xpbar{width:90px;height:8px;background:var(--line);border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle}
.xpbar i{display:block;height:100%;background:var(--accent)}
.progress{display:flex;gap:6px;margin-bottom:14px}
.progress div{flex:1;height:5px;border-radius:3px;background:var(--line);transition:background .3s}
.progress .on{background:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
@keyframes blink{50%{opacity:0}}
.tag{font-size:13px;color:var(--accent);font-weight:700}
h1,h2{margin:6px 0 10px;line-height:1.25}h2{font-size:22px}
p{margin:8px 0}.muted{color:var(--muted)}.small{font-size:13px}.center{text-align:center}
code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
pre{background:var(--deep);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;font-size:14px;margin:10px 0}
code{background:var(--deep);padding:1px 6px;border-radius:5px;font-size:.9em}
.hl{background:rgba(139,92,246,.3);border-radius:4px;padding:0 2px}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-weight:700}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:18px;flex-wrap:wrap}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
/* chat */
.chat{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:90%;animation:pop .25s ease}
.msg p{margin:0;background:#1f2437;border-radius:16px 16px 16px 4px;padding:9px 13px;min-height:38px}
.msg.me{align-self:flex-end}.msg.me p{background:var(--accent);border-radius:16px 16px 4px 16px}
.av{flex:none;min-width:30px;height:30px;padding:0 6px;border-radius:15px;background:var(--g1);display:grid;place-items:center;font-size:11px;font-weight:800;color:#111}
.dots3{display:flex;gap:4px;align-items:center}
.dots3 i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bob 1s infinite}
.dots3 i:nth-child(2){animation-delay:.15s}.dots3 i:nth-child(3){animation-delay:.3s}
@keyframes bob{30%{transform:translateY(-5px)}}
.react{align-self:flex-start;margin:-4px 0 0 40px;font-size:22px;animation:pop .4s}
/* tables as rows */
.stage{display:flex;flex-direction:column;gap:6px;margin:12px 0;overflow-x:auto}
.trow{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(60px,1fr));gap:8px;padding:8px 12px;border-radius:10px;background:#11141c;border:1px solid var(--line);font-size:14px;transition:background .4s,border-color .4s}
.trow.head{background:transparent;border-color:transparent;color:var(--muted);font-size:12px}
.trow.fresh{animation:pop .4s ease both}
.g0{border-color:var(--g0)!important;background:color-mix(in srgb,var(--g0) 13%,transparent)!important}
.g1{border-color:var(--g1)!important;background:color-mix(in srgb,var(--g1) 13%,transparent)!important}
.g2{border-color:var(--g2)!important;background:color-mix(in srgb,var(--g2) 13%,transparent)!important}
.g3{border-color:var(--g3)!important;background:color-mix(in srgb,var(--g3) 13%,transparent)!important}
.g4{border-color:var(--g4)!important;background:color-mix(in srgb,var(--g4) 13%,transparent)!important}
.g5{border-color:var(--g5)!important;background:color-mix(in srgb,var(--g5) 13%,transparent)!important}
.dots{display:flex;gap:6px;justify-content:center;margin-top:8px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--accent)}
/* playground */
.controls{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.seg{display:flex;background:var(--deep);border:1px solid var(--line);border-radius:10px;padding:3px;flex-wrap:wrap}
.seg button{background:none;border:0;padding:6px 12px;border-radius:8px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff}
.bar{display:grid;grid-template-columns:minmax(70px,auto) 1fr minmax(44px,auto);gap:10px;align-items:center;margin:8px 0;font-size:14px}
.bar .track{height:22px;background:var(--deep);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;border-radius:6px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
/* drag and drop pieces (also for custom scenes) */
.tray{display:flex;gap:8px;flex-wrap:wrap;min-height:56px;padding:10px;border:1px dashed var(--line);border-radius:14px;margin:10px 0;background:var(--deep)}
.chip{position:relative;display:flex;gap:8px;align-items:center;background:#1c2134;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;cursor:grab;user-select:none;touch-action:none}
.chip.sel{border-color:var(--cool);box-shadow:0 0 0 2px var(--cool)}
.chip.drag{cursor:grabbing;z-index:50;box-shadow:0 18px 30px rgba(0,0,0,.6)}
.chip.back{transition:transform .35s cubic-bezier(.2,1.6,.4,1)}
.chip.placed{cursor:default}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px}
.bucket{border:2px dashed var(--line);border-radius:14px;padding:10px;min-height:130px;transition:transform .15s,background .2s}
.bucket.over{transform:scale(1.03);background:rgba(139,92,246,.12)}
.bucket.nope{animation:shake .4s}
.bucket .pile{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.total{font:900 clamp(24px,7vw,38px) ui-monospace,Menlo,monospace;text-align:center;padding:12px 0;animation:pop .5s}
/* quiz */
.term .pr{color:var(--cool)}.term .out{color:#a7f3d0}
.cursor{display:inline-block;width:8px;height:1em;background:var(--cool);vertical-align:text-bottom;animation:blink 1s steps(1) infinite}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:#11141c;border:1px solid var(--line);border-radius:12px;padding:12px 14px;transition:transform .15s,border-color .2s,background .2s}
.opt kbd{flex:none;font:700 12px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
.opt pre{margin:0;border:0;background:none;padding:0}
.opt.picked{border-color:var(--cool)}
.opt.right{border-color:var(--good);background:rgba(34,197,94,.12)}
.opt.wrong{border-color:var(--bad);background:rgba(239,68,68,.12);animation:shake .4s}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;animation:in .3s}
.fb.good{background:rgba(34,197,94,.12);border:1px solid var(--good)}
.fb.bad{background:rgba(239,68,68,.1);border:1px solid var(--bad)}
.drag{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.di{display:flex;align-items:center;gap:10px;background:#11141c;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:grab;user-select:none}
.di.dragging{opacity:.4}
.di .n{width:26px;height:26px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.di .t{flex:1}
.di .mv{background:none;border:1px solid var(--line);border-radius:6px;width:30px;height:28px}
.di.right{border-color:var(--good)}.di.wrong{border-color:var(--bad)}
.float{position:fixed;font-weight:800;color:var(--accent);pointer-events:none;animation:rise 1.1s ease forwards;z-index:30}
@keyframes rise{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-60px)}}
/* win */
.badge{font-size:64px;display:inline-block;animation:badge .8s cubic-bezier(.2,1.6,.4,1) both}
@keyframes badge{from{transform:scale(0) rotate(-30deg)}to{transform:none}}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat{background:var(--deep);border:1px solid var(--line);border-radius:12px;padding:10px 6px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.stat small{color:var(--muted);font-size:12px}
.code{font:800 clamp(22px,6.5vw,32px) ui-monospace,Menlo,monospace;letter-spacing:.12em;background:var(--deep);border:2px dashed var(--accent);border-radius:12px;padding:12px 20px;display:inline-block;margin:10px 0}
/* template library */
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin:14px 0}
.node{flex:1 1 110px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#11141c;transition:border-color .3s,background .3s,transform .3s;opacity:.55}
.node b{display:block}.node small{color:var(--muted);font-size:12px}
.node.done{opacity:1}.node.on{opacity:1;border-color:var(--accent);background:rgba(139,92,246,.16);transform:translateY(-3px)}
.arrow{align-self:center;color:var(--muted)}
.packet{display:inline-block;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;background:var(--deep);border:1px dashed var(--accent);border-radius:10px;padding:6px 12px;margin:2px 0 8px;animation:pop .3s}
.cells{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.cell{min-width:44px;text-align:center;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:#11141c;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;transition:all .2s}
.cell small{display:block;color:var(--muted);font-size:10px}
.cell.on{border-color:var(--accent);background:rgba(139,92,246,.22);transform:translateY(-3px)}
.slide{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin:12px 0}
.slide input{width:100%;accent-color:var(--accent)}
.slide b{font-family:ui-monospace,Menlo,Consolas,monospace;min-width:48px;text-align:right}
.line{display:flex;flex-wrap:wrap;gap:6px;min-height:52px;padding:10px;border:1px solid var(--accent);border-radius:12px;background:var(--deep);margin:10px 0;align-items:center}
.line:empty::before{content:"Tap the pieces below in order";color:var(--muted);font-size:14px}
.pool{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.piece{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;background:#1c2134;border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.piece:disabled{opacity:.25}
.line.wrongline{animation:shake .4s;border-color:var(--bad)}.line.rightline{border-color:var(--good)}
.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.matchgrid .tray{flex-direction:column;margin:0}
.matchgrid .slotcol{display:flex;flex-direction:column;gap:8px}
.matchgrid .bucket{min-height:0;padding:8px 10px}
.matchgrid .bucket .pile{margin-top:6px}
.blank{display:inline-block;min-width:54px;text-align:center;border-bottom:2px solid var(--accent);color:var(--cool)}
.lft{flex:0 0 38%;font-weight:700;border-right:1px solid var(--line);padding-right:10px}
.res:empty{display:none}
.deeper{margin-top:14px}.deeper .fb{border:1px solid var(--line);background:var(--deep)}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:16px}
.vee,.levelup,.combo,.arcade-only{display:none}

/* ---------- arcade look: everything turned up ---------- */
.arcade{background:radial-gradient(1200px 700px at 80% -10%,#1b1440 0,transparent 60%),radial-gradient(900px 600px at -10% 110%,#0b2a3a 0,transparent 60%),#090b12;background-attachment:fixed}
.arcade .wrap{padding-bottom:150px}
.arcade .wrap.quake{animation:quake .45s}
@keyframes quake{20%{transform:translate(-8px,3px) rotate(-.6deg)}40%{transform:translate(7px,-3px) rotate(.5deg)}60%{transform:translate(-5px,2px)}80%{transform:translate(3px,-1px)}}
.arcade .arcade-only{display:inline-block}
.arcade .logo span{background:linear-gradient(90deg,var(--accent),var(--hot),var(--cool));-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200%;animation:hue 5s linear infinite}
@keyframes hue{to{background-position:200%}}
.arcade .combo{display:inline-block;border-color:var(--hot);color:#fff;background:linear-gradient(90deg,var(--hot),var(--accent));font-weight:800}
.arcade .pop{animation:pop .4s cubic-bezier(.2,1.8,.4,1)}
.arcade .xpbar i{background:linear-gradient(90deg,var(--accent),var(--cool));box-shadow:0 0 10px var(--accent)}
.arcade .progress .on{box-shadow:0 0 10px rgba(139,92,246,.8)}
.arcade .card{background:linear-gradient(180deg,rgba(255,255,255,.03),transparent 40%),#151826;border-radius:18px;animation:in3 .5s cubic-bezier(.2,.9,.3,1.1);box-shadow:0 20px 60px rgba(0,0,0,.45)}
@keyframes in3{from{opacity:0;transform:perspective(900px) rotateX(-14deg) translateY(26px) scale(.96)}to{opacity:1;transform:none}}
.arcade .tag{color:var(--cool)}
.arcade .hl{box-shadow:0 0 14px rgba(139,92,246,.6)}
.arcade .btn{background:linear-gradient(135deg,var(--accent),#6d3df0);border-radius:12px;box-shadow:0 6px 0 #4c1fb5,0 10px 24px rgba(139,92,246,.35);transition:transform .08s,box-shadow .08s}
.arcade .btn:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 #4c1fb5}
.arcade .btn.ghost{background:transparent;box-shadow:none}
.arcade .btn.glow{animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 6px 0 #4c1fb5,0 0 28px rgba(139,92,246,.9)}}
.arcade .seg button.on{box-shadow:0 0 14px rgba(139,92,246,.7)}
.arcade .bar .fill{box-shadow:0 0 16px currentColor}
.arcade .opt:hover:not(:disabled){transform:translateY(-2px) scale(1.01);box-shadow:0 8px 24px rgba(139,92,246,.25)}
.arcade .opt.right{box-shadow:0 0 22px rgba(34,197,94,.35)}
.arcade .float{color:#fff;text-shadow:0 0 12px var(--accent);font-size:18px}
.arcade .term{border-color:var(--accent);box-shadow:inset 0 0 30px rgba(139,92,246,.15)}
.arcade .code{box-shadow:0 0 30px rgba(139,92,246,.4)}
.splash{text-align:center;padding:9vh 0 4vh}
.splash .big{font-size:clamp(44px,12vw,92px);font-weight:900;letter-spacing:-.03em;line-height:1}
.splash .big b{display:inline-block;animation:drop .7s cubic-bezier(.2,1.6,.4,1) both}
.splash .big span b{background:linear-gradient(90deg,var(--accent),var(--hot),var(--cool),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;background-size:300%;animation:drop .7s cubic-bezier(.2,1.6,.4,1) both,hue 4s linear infinite}
@keyframes drop{from{opacity:0;transform:translateY(-70px) rotate(-12deg) scale(.5)}to{opacity:1;transform:none}}
.topic{display:inline-block;font:700 clamp(18px,5vw,30px) ui-monospace,Menlo,Consolas,monospace;border:1px dashed var(--line);border-radius:12px;padding:8px 16px;margin:18px 0 22px;background:var(--deep)}
.arcade .vee{position:fixed;right:16px;bottom:14px;z-index:20;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none}
.vee .say{max-width:230px;background:#fff;color:#151826;border-radius:14px 14px 4px 14px;padding:8px 12px;font-size:14px;font-weight:600;opacity:0;transform:translateY(8px) scale(.9);transition:all .25s cubic-bezier(.2,1.6,.4,1)}
.vee .say.on{opacity:1;transform:none}
.vee .body{pointer-events:auto;cursor:pointer;width:68px;height:60px;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 30% 25%,#c4b5fd,var(--accent) 60%,#5b21b6);box-shadow:0 10px 26px rgba(139,92,246,.6);display:flex;justify-content:center;gap:10px;padding-top:18px;position:relative;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.eye{width:16px;height:18px;background:#fff;border-radius:50%;display:grid;place-items:center}
.eye b{width:7px;height:8px;background:#151826;border-radius:50%;transition:transform .08s}
.mouth{position:absolute;left:50%;bottom:11px;width:16px;height:8px;margin-left:-8px;border-bottom:3px solid #151826;border-radius:0 0 12px 12px;transition:all .2s}
.vee.happy .body{animation:hop .5s cubic-bezier(.2,1.6,.4,1) 2}
.vee.happy .mouth{height:11px;width:20px;margin-left:-10px;background:#151826;border-radius:2px 2px 14px 14px}
.vee.sad .mouth{border-bottom:0;border-top:3px solid #151826;border-radius:12px 12px 0 0;bottom:7px}
.vee.sad .body{animation:shake .4s}
.vee.spin .body{animation:spin .6s}
@keyframes hop{50%{transform:translateY(-22px) scale(1.08,.94)}}
@keyframes spin{to{transform:rotate(360deg)}}
.arcade .levelup{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(9,11,18,.7);backdrop-filter:blur(4px)}
.levelup div{text-align:center;animation:zoom .7s cubic-bezier(.2,1.7,.4,1)}
.levelup small{display:block;font-size:22px;font-weight:800;color:var(--cool)}
.levelup b{font-size:clamp(90px,26vw,200px);line-height:1;font-weight:900;background:linear-gradient(180deg,#fff,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes zoom{from{opacity:0;transform:scale(.2) rotate(-12deg)}}
.vault{position:relative;overflow:hidden}
.door{position:absolute;top:0;bottom:0;width:50.5%;z-index:3;background:repeating-linear-gradient(90deg,#1b1f31 0 22px,#171a2a 22px 44px);border:1px solid var(--line);transition:transform 1s cubic-bezier(.7,0,.2,1)}
.door.dl{left:0}.door.dr{right:0}
.vault.open .door.dl{transform:translateX(-102%)}.vault.open .door.dr{transform:translateX(102%)}
.lock{position:absolute;left:50%;top:50%;z-index:4;font-size:64px;transform:translate(-50%,-50%);transition:transform .6s cubic-bezier(.5,-0.6,.3,1.4),opacity .3s .5s}
.vault.unlock .lock{transform:translate(-50%,-50%) rotate(360deg) scale(1.3)}
.vault.open .lock{opacity:0}
.coin{width:110px;height:110px;margin:6px auto;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#fde68a,#f59e0b 60%,#b45309);box-shadow:0 0 40px rgba(245,158,11,.6),inset 0 0 0 6px rgba(255,255,255,.25);font-size:54px;animation:flip 1.6s cubic-bezier(.2,.8,.2,1) .9s both}
@keyframes flip{from{transform:rotateY(1080deg) scale(.2)}to{transform:none}}
.calm *,.calm *::before,.calm *::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media (max-width:900px){.vee .body{pointer-events:none;opacity:.9}}
@media (max-width:560px){.statrow{grid-template-columns:repeat(3,1fr)}.bucket{padding:6px}.vee .body{width:54px;height:48px;padding-top:13px}.vee .say{max-width:190px}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="wrap" id="wrap">
  <header>
    <div class="logo">Vee <span>Check</span></div>
    <div class="stats">
      <span class="pill combo" id="combo" hidden></span>
      <span class="pill" id="streakPill">🔥 <b id="streak">0</b>-day streak</span>
      <span class="pill">Lv <b id="lvl">1</b> <span class="xpbar"><i id="xpfill"></i></span> <span id="xp">0</span> XP</span>
      <button class="pill arcade-only" id="snd" aria-pressed="false" aria-label="Sound">🔇</button>
      <button class="pill arcade-only" id="calmBtn" aria-pressed="false">Calm</button>
    </div>
  </header>
  <div class="progress" id="progress"></div>
  <main id="main"><div class="card"><p>This page has no quiz in it. It is the Vee Check template; <code>vc.py build</code> fills it in.</p></div></main>
  <div class="note" id="note"></div>
</div>
<div class="vee" id="vee"><div class="say" id="say" role="status"></div><div class="body" id="veeBody" title="Poke me"><i class="eye"><b></b></i><i class="eye"><b></b></i><span class="mouth"></span></div></div>
<div class="levelup" id="levelup" hidden><div><small>Level up</small><b id="lvnum">2</b></div></div>

<script id="vc-data" type="application/json">__VC_DATA__</script>
<script>
/*__VC_CORE__*/
(() => {
const D=VC.data; if(!D) return;
const A=D.look==='arcade', {fmt,esc}=VC, codeHTML=VC.code;
document.body.classList.add(A?'arcade':'classic');
document.title='Vee Check: '+D.topic;
const LESSON=D.lesson||[], QN=(D.questions||[]).length, TOTAL=LESSON.length+QN+1, PER=250, EARN=!D.review;
const PAL=['#8b5cf6','#22c55e','#f59e0b','#3b82f6','#ec4899','#22d3ee'];
document.getElementById('note').innerHTML=`${D.review?'Review, no gate. ':''}Topic: <b>${esc(D.topic)}</b>. Keys: 1 to 9 answer, Enter continues.`;

// ---------- helpers ----------
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait=ms=>sleep(calm||!A?0:ms);
let scene=0; const enter=()=>++scene;
const mid=el=>{const r=el.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2]};
function h(html,cls=''){$('#main').innerHTML=`<div class="card ${cls}">${html}</div>`}
function roll(el,from,to,ms,suffix=''){
  if(calm){el.textContent=to+suffix;return}
  const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-p,3);
    el.textContent=Math.round(from+(to-from)*e)+suffix;if(p<1)requestAnimationFrame(f);else el.textContent=to+suffix})(t0);
}
function flip(container,mutate){
  const first=new Map([...container.children].map(e=>[e.dataset.key||e,e.getBoundingClientRect()]));
  mutate();
  if(calm)return;
  [...container.children].forEach(e=>{const f=first.get(e.dataset.key||e);if(!f){e.classList.add('fresh');return}
    const l=e.getBoundingClientRect(),dx=f.left-l.left,dy=f.top-l.top;
    if(dx||dy)e.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:600,easing:'cubic-bezier(.2,.8,.2,1)'})});
}

// ---------- particles (arcade background, confetti for both looks) ----------
const cv=$('#fx'),cx=cv.getContext('2d');let W=0,H=0;
function size(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}
size();addEventListener('resize',size);
const stars=A?Array.from({length:70},()=>({x:Math.random(),y:Math.random(),vx:(Math.random()-.5)*.0003,vy:(Math.random()-.5)*.0003,r:Math.random()*1.6+.4})):[];
let sparks=[],running=false;const mouse={x:-999,y:-999};
function burst(x,y,n=36,power=7){
  if(calm)return;
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=Math.random()*power+1;
    sparks.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:1,decay:.012+Math.random()*.02,c:PAL[i%PAL.length],s:2+Math.random()*4,rot:Math.random()*6,vr:(Math.random()-.5)*.4})}
  if(!running){running=true;requestAnimationFrame(frame)}
}
function frame(){
  cx.clearRect(0,0,W,H);
  if(A&&!calm)for(const s of stars){s.x=(s.x+s.vx+1)%1;s.y=(s.y+s.vy+1)%1;const x=s.x*W,y=s.y*H,d=Math.hypot(x-mouse.x,y-mouse.y);
    cx.fillStyle='rgba(200,190,255,.55)';cx.beginPath();cx.arc(x,y,s.r,0,7);cx.fill();
    if(d<150){cx.strokeStyle=`rgba(139,92,246,${.5*(1-d/150)})`;cx.beginPath();cx.moveTo(x,y);cx.lineTo(mouse.x,mouse.y);cx.stroke()}}
  for(const p of sparks){p.vy+=.14;p.x+=p.vx;p.y+=p.vy;p.vx*=.985;p.life-=p.decay;p.rot+=p.vr;
    cx.save();cx.globalAlpha=Math.max(0,p.life);cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*1.6);cx.restore()}
  sparks=sparks.filter(p=>p.life>0&&p.y<H+40);
  if(A||sparks.length)requestAnimationFrame(frame);else running=false;
}
if(A){running=true;frame()}

// ---------- sound (arcade only, off until chosen) ----------
let AC=null,soundOn=false;
function tone(f,d=.12,type='sine',v=.07,when=0){
  if(!soundOn)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}
}
const sfx={
  click:()=>tone(520,.05,'triangle',.05), tick:()=>tone(900,.02,'square',.015),
  drop:()=>{tone(300,.08,'sine',.08);tone(460,.1,'sine',.06,.05)},
  nope:()=>tone(170,.14,'sawtooth',.05),
  good:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.15,'triangle',.07,i*.07)),
  bad:()=>{tone(200,.18,'sawtooth',.06);tone(140,.26,'sawtooth',.06,.12)},
  level:()=>[392,523,659,784,1047,1319].forEach((f,i)=>tone(f,.22,'square',.035,i*.09)),
  crush:()=>[220,330,440,660].forEach((f,i)=>tone(f,.1,'sine',.07,i*.04)),
};
function setSound(on){soundOn=on;$('#snd').textContent=on?'🔊':'🔇';$('#snd').setAttribute('aria-pressed',on);if(on)sfx.click()}
$('#snd').onclick=()=>setSound(!soundOn);
function setCalm(on){calm=on;document.body.classList.toggle('calm',on);$('#calmBtn').setAttribute('aria-pressed',on);if(on)sparks=[]}
$('#calmBtn').onclick=()=>setCalm(!calm);setCalm(calm);

// ---------- XP, level, combo. XP comes only from questions and passing, the same sum vc.py logs. ----------
const base=D.stats||{xp:0,streak:0};let xpNow=base.xp||0,shown=xpNow,combo=0,best=0,gained=0;
$('#streak').textContent=base.streak||0;
function drawXP(){$('#lvl').textContent=Math.floor(shown/PER)+1;$('#xp').textContent=Math.round(shown);$('#xpfill').style.width=((shown%PER)/PER*100)+'%'}
drawXP();
function floater(txt,el){const [x,y]=mid(el||$('#xp'));const f=document.createElement('div');f.className='float';f.textContent=txt;
  f.style.left=(x-28)+'px';f.style.top=(y-24)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),1300)}
function addXP(n,el){
  if(!EARN)return;
  const before=Math.floor(xpNow/PER);xpNow+=n;gained+=n;floater('+'+n+' XP',el);
  const from=shown,to=xpNow,t0=performance.now();
  (function f(t){const p=calm?1:Math.min(1,(t-t0)/700);shown=from+(to-from)*p;drawXP();if(p<1)requestAnimationFrame(f)})(t0);
  if(A&&Math.floor(xpNow/PER)>before)setTimeout(()=>levelUp(Math.floor(xpNow/PER)+1),500);
}
function levelUp(n){$('#lvnum').textContent=n;const o=$('#levelup');o.hidden=false;sfx.level();burst(W/2,H/2,140,11);setTimeout(()=>o.hidden=true,calm?900:1700)}
function setCombo(n){combo=n;best=Math.max(best,n);const c=$('#combo');c.hidden=!A||n<2;if(A&&n>=2){c.textContent='Combo x'+n;c.classList.remove('pop');void c.offsetWidth;c.classList.add('pop')}}

// ---------- mascot (arcade) ----------
let sayT;
function say(txt,mood='',ms=3800){if(!A)return;const v=$('#vee'),s=$('#say');v.className='vee '+mood;s.textContent=txt;s.classList.add('on');
  clearTimeout(sayT);sayT=setTimeout(()=>{s.classList.remove('on');v.className='vee'},ms)}
const QUIPS=['I live in this corner now.','That tickles.','Fun fact: I am 100% CSS.','You can turn me down with Calm mode.','Still here. Still watching.'];
$('#veeBody').onclick=()=>{say(QUIPS[Math.floor(Math.random()*QUIPS.length)],'spin');sfx.click();burst(...mid($('#veeBody')),18,4)};
addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;if(!A)return;
  $$('.eye b').forEach(p=>{const [x,y]=mid(p.parentNode),a=Math.atan2(e.clientY-y,e.clientX-x);p.style.transform=`translate(${Math.cos(a)*3.5}px,${Math.sin(a)*3.5}px)`})});

// ---------- chat ----------
async function typeInto(el,html,text,my){
  if(calm||!A){el.innerHTML=html;return}
  for(let i=1;i<=text.length;i++){if(my!==scene)return;el.textContent=text.slice(0,i);if(i%4===0)sfx.tick();await sleep(12)}
  el.innerHTML=html;
}
async function bubble(who,text,my,av){
  const c=$('#chat');if(!c||my!==scene)return;const b=document.createElement('div');b.className='msg '+who;
  b.innerHTML=(who==='them'?`<span class="av">${esc(av||'?')}</span>`:'')+'<p></p>';c.appendChild(b);await typeInto(b.querySelector('p'),fmt(text),String(text).replace(/[`*]/g,''),my);
}
async function typing(my,ms,av){
  const c=$('#chat');if(calm||!A||!c||my!==scene)return;const b=document.createElement('div');b.className='msg them';
  b.innerHTML=`<span class="av">${esc(av||'?')}</span><p class="dots3"><i></i><i></i><i></i></p>`;c.appendChild(b);await sleep(ms);b.remove();
}

// ---------- tables shown as rows ----------
function groupClass(table,i){if(!table.groups)return '';const names=[...new Set(table.groups)];return ' g'+(names.indexOf(table.groups[i])%6)}
function rowsHTML(t){
  if(!t)return '';
  const cols=(t.columns||t.rows[0]||[]).length;
  return (t.columns?`<div class="trow head" style="--cols:${cols}">${t.columns.map(c=>`<span>${esc(c)}</span>`).join('')}</div>`:'')+
    (t.rows||[]).map((r,i)=>`<div class="trow${groupClass(t,i)}" data-key="${esc(r[0])}" style="--cols:${cols}">${r.map(c=>`<span>${esc(c)}</span>`).join('')}</div>`).join('');
}

// ---------- drag and drop (used by custom scenes): drag, or tap an item then tap a target ----------
function dragDrop({items,targets,accepts,onDrop,onReject}){
  let selected=null;
  const tryDrop=(item,target)=>{
    if(!target||item.classList.contains('placed'))return false;
    if(accepts(item,target)){item.classList.remove('sel','drag','back');item.classList.add('placed');item.style.transform='';item.removeAttribute('tabindex');selected=null;
      const before=item.getBoundingClientRect();onDrop(item,target);
      if(!calm){const after=item.getBoundingClientRect();item.animate([{transform:`translate(${before.left-after.left}px,${before.top-after.top}px) scale(1.1)`},{transform:'none'}],{duration:380,easing:'cubic-bezier(.2,1.5,.3,1)'})}
      sfx.drop();return true}
    target.classList.add('nope');setTimeout(()=>target.classList.remove('nope'),420);sfx.nope();if(onReject)onReject(item,target);return false;
  };
  const targetAt=(x,y,item)=>{item.style.pointerEvents='none';const el=document.elementFromPoint(x,y);item.style.pointerEvents='';return el&&[...targets].find(t=>t.contains(el))};
  [...items].forEach(item=>{
    let sx,sy,moved,down=false;item.tabIndex=0;item.setAttribute('role','button');
    const pick=()=>{[...items].forEach(c=>c.classList.remove('sel'));selected=item;item.classList.add('sel');sfx.click()};
    item.addEventListener('pointerdown',e=>{if(item.classList.contains('placed'))return;down=true;moved=false;sx=e.clientX;sy=e.clientY;try{item.setPointerCapture(e.pointerId)}catch(err){}item.classList.remove('back')});
    item.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.hypot(dx,dy)>6)moved=true;
      if(moved){item.classList.add('drag');item.style.transform=`translate(${dx}px,${dy}px) rotate(4deg) scale(1.08)`;const t=targetAt(e.clientX,e.clientY,item);[...targets].forEach(x=>x.classList.toggle('over',x===t))}});
    const up=e=>{if(!down)return;down=false;[...targets].forEach(x=>x.classList.remove('over'));
      if(!moved){pick();return}
      item.classList.remove('drag');
      if(!tryDrop(item,targetAt(e.clientX,e.clientY,item))){item.classList.add('back');item.style.transform=''}};
    item.addEventListener('pointerup',up);item.addEventListener('pointercancel',up);
    item.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();pick()}});
  });
  [...targets].forEach(t=>{t.tabIndex=0;t.setAttribute('role','button');
    const place=()=>{if(selected)tryDrop(selected,t)};
    t.addEventListener('click',place);t.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();place()}})});
  return {place:(item,target)=>tryDrop(item,target)};
}

// ---------- flow ----------
function progress(n){$('#progress').innerHTML=Array.from({length:TOTAL},(_,i)=>`<div class="${i<n?'on':''}"></div>`).join('')}
function top(){window.scrollTo({top:0,behavior:calm?'auto':'smooth'})}
function go(i){if(i>=LESSON.length){startQuiz();top();return}progress(i+1);renderScene(i);top()}
const tagOf=(i,s)=>`<div class="tag">Learn ${i+1} of ${LESSON.length}</div><h2>${fmt(s.title)}</h2>`;
const navOf=(i,label)=>`<div class="nav">${i>0?`<button class="btn ghost" data-go="${i-1}">Back</button>`:'<span></span>'}<button class="btn${A?' glow':''}" id="next" data-go="${i+1}" data-enter>${label||(i===LESSON.length-1?'Quiz me':'Next')}</button></div>`;
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b&&!b.disabled){sfx.click();go(+b.dataset.go)}});

function splash(){
  enter();progress(0);
  $('#main').innerHTML=`<div class="splash">
    <div class="big">${[...'Vee'].map((c,i)=>`<b style="animation-delay:${i*70}ms">${c}</b>`).join('')}<span>${[...'Check'].map((c,i)=>`<b style="animation-delay:${(i+3)*70}ms">${c}</b>`).join('')}</span></div>
    <p class="muted" style="margin-top:18px">${D.review?'A review of':D.gate===false?'No gate on this one. A lesson on':'Before Claude writes this code, a quick one on'}</p>
    <div class="topic">${esc(D.topic)}</div>
    <div class="row"><button class="btn glow" id="s1" data-enter>Start with sound 🔊</button><button class="btn ghost" id="s0">Start quiet</button></div>
    <p class="muted small" style="margin-top:22px">${LESSON.length?LESSON.length+' lesson '+(LESSON.length===1?'scene':'scenes')+', ':''}${QN} ${QN===1?'question':'questions'}${D.review?'':', 1 pass code'}</p></div>`;
  $('#s1').onclick=()=>{setSound(true);sfx.good();go(0)};
  $('#s0').onclick=()=>{setSound(false);go(0)};
  say('Hi, I\'m Vee. I\'ll be heckling from down here.','happy',4500);
}

function renderScene(i){
  const s=LESSON[i];
  try{({story,steps,playground,card,custom,sort,match,flow,slider,build,compare})[s.type](s,i);deeper(s)}
  catch(err){console.error('Vee Check scene failed',err);if(s.fallback){LESSON[i]=s.fallback;renderScene(i)}else h(tagOf(i,s)+'<p class="muted">This scene could not be shown.</p>'+navOf(i))}
}

// "Go deeper": one level more detail than the lesson's depth, for people who want it.
function deeper(s){
  const nav=$('.card .nav');if(!s.deeper||!nav)return;
  const box=document.createElement('div');box.className='deeper';
  box.innerHTML=`<button class="pill" id="deeperBtn" aria-expanded="false">Go deeper</button><div class="fb" id="deeperTxt" hidden>${fmt(s.deeper)}</div>`;
  nav.before(box);
  $('#deeperBtn').onclick=()=>{const t=$('#deeperTxt');t.hidden=!t.hidden;$('#deeperBtn').setAttribute('aria-expanded',!t.hidden);$('#deeperBtn').textContent=t.hidden?'Go deeper':'Hide the detail';sfx.click()};
}

async function story(s,i){
  const my=enter();
  h(tagOf(i,s)+`<div class="chat" id="chat"></div><div class="stage" id="stage" hidden>${rowsHTML(s.table)}</div><p id="body" hidden>${fmt(s.body||'')}</p>${navOf(i)}`);
  for(const m of s.messages){await typing(my,650,s.from);await bubble('them',m,my,s.from);await wait(250)}
  if(my!==scene)return;
  if(s.table){$('#stage').hidden=false;$$('#stage .trow').forEach((r,n)=>{r.classList.add('fresh');r.style.animationDelay=(n*80)+'ms'});sfx.drop()}
  if(s.body)$('#body').hidden=false;
}

function steps(s,i){
  enter();let n=0;
  h(tagOf(i,s)+`<pre id="codeline" hidden></pre><p id="steptxt"></p><div class="stage" id="stage"></div><div class="dots" id="dots"></div>
    <div class="nav">${i>0?`<button class="btn ghost" data-go="${i-1}">Back</button>`:'<span></span>'}<button class="btn" id="nextStep" data-enter></button></div>`);
  const draw=()=>{
    const st=s.steps[n];
    $('#codeline').hidden=!st.code;$('#codeline').innerHTML=codeHTML(st.code||'');$('#steptxt').innerHTML=fmt(st.text);
    $('#dots').innerHTML=s.steps.map((_,k)=>`<i class="${k<=n?'on':''}"></i>`).join('');
    const last=n===s.steps.length-1;$('#nextStep').textContent=last?(i===LESSON.length-1?'Quiz me':'Next'):'Next step';
    if(st.table)flip($('#stage'),()=>{$('#stage').innerHTML=rowsHTML(st.table)});
    if(n>0)sfx.drop();
  };
  $('#nextStep').onclick=()=>{if(n<s.steps.length-1){n++;draw()}else go(i+1)};
  draw();
}

function playground(s,i){
  enter();const pick=s.controls.map(c=>c.options[0]),tried=new Set();
  h(tagOf(i,s)+(s.body?`<p>${fmt(s.body)}</p>`:'')+`<div class="controls">${s.controls.map((c,k)=>`<div class="seg" data-k="${k}" role="group" aria-label="${esc(c.name)}">${c.options.map(o=>`<button data-v="${esc(o)}">${esc((c.label||'')+o)}</button>`).join('')}</div>`).join('')}</div>
    <pre id="pgcode" hidden></pre><div id="bars"></div><p class="muted" id="pgsay"></p>`+navOf(i,i===LESSON.length-1?'I got it, quiz me':'Next'));
  const draw=()=>{
    $$('.seg').forEach(seg=>seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===pick[+seg.dataset.k])));
    const r=s.results[pick.join('|')]||{},rows=r.rows||[],numeric=rows.length&&rows.every(x=>typeof x[1]==='number');
    $('#pgcode').hidden=!r.code;$('#pgcode').innerHTML=codeHTML(r.code||'');
    const bars=$('#bars'),sig=rows.map(x=>x[0]).join('|')+numeric;
    if(numeric){
      const max=Math.max(1e-9,...rows.map(x=>Math.abs(x[1])));
      if(bars.dataset.sig!==sig){bars.dataset.sig=sig;bars.innerHTML=rows.map((x,k)=>`<div class="bar"><span>${esc(x[0])}</span><div class="track"><div class="fill" style="width:0;background:${PAL[(k+3)%PAL.length]};color:${PAL[(k+3)%PAL.length]}"></div></div><span class="v"></span></div>`).join('')}
      requestAnimationFrame(()=>rows.forEach((x,k)=>{const b=bars.children[k];if(!b)return;b.querySelector('.fill').style.width=(Math.abs(x[1])/max*100)+'%';b.querySelector('.v').textContent=x[1]+(r.unit||'')}));
    }else{bars.dataset.sig='';bars.innerHTML=`<div class="stage">${rowsHTML({rows:rows.map(x=>x.map(String))})}</div>`}
    $('#pgsay').innerHTML=fmt(r.say||'');
    tried.add(pick.join('|'));
    if(A&&tried.size===Object.keys(s.results).length&&tried.size>2&&!s._done){s._done=true;say('You tried every combination. Respect.','happy')}
  };
  $$('.seg').forEach(seg=>seg.onclick=e=>{if(e.target.dataset.v!==undefined){pick[+seg.dataset.k]=e.target.dataset.v;sfx.click();draw()}});
  draw();
}

function card(s,i){
  const my=enter();
  h(tagOf(i,s)+`<p>${fmt(s.body)}</p>${s.code?`<pre class="term" id="term">${codeHTML(s.code)}<span class="out" id="out"></span></pre>`:''}
    ${s.output?'<p class="muted" id="ask">Decide what this prints, then run it.</p><div class="row"><button class="btn ghost" id="run">Run it</button></div>':''}`+navOf(i));
  if(s.output)$('#run').onclick=async()=>{$('#run').disabled=true;$('#ask').hidden=true;
    for(const line of String(s.output).split('\n')){if(my!==scene)return;$('#out').textContent+='\n'+line;sfx.tick();await wait(260)}};
}


// ---------- template library: lesson scenes ----------
const lead=s=>(s.body?`<p>${fmt(s.body)}</p>`:'');
function stagger(list,fn,gap=260){const my=scene;list.forEach((x,k)=>setTimeout(()=>{if(my===scene)fn(x,k)},calm?0:k*gap))}

// sort: drag each item into the pile it belongs to, then (optionally) press a button for the result
function sort(s,i){
  enter();const groups=s.groups||[...new Set(s.items.map(x=>x.group))];let placed=0;
  h(tagOf(i,s)+lead(s)+(s.code?`<pre id="scode">${codeHTML(s.code)}</pre>`:'')+`<p class="muted small">Drag each one into its pile, or tap it and then tap a pile.</p>
    <div class="tray" id="tray">${s.items.map((x,k)=>`<div class="chip" data-k="${k}"><b>${esc(x.label)}</b>${x.detail?` <span class="muted">${esc(x.detail)}</span>`:''}</div>`).join('')}</div>
    <div class="buckets">${groups.map((g,k)=>`<div class="bucket g${k%6}" data-k="${k}"><b>${esc(g)}</b><div class="pile"></div><div class="res"></div></div>`).join('')}</div>
    <div class="row" style="margin-top:14px"><button class="btn ghost" id="auto">Do it for me</button>${s.result?`<button class="btn" id="res" disabled>${esc(s.result.button||'Show the result')}</button>`:''}</div>
    <p class="muted" id="ssay"></p>`+navOf(i));
  const groupOf=c=>groups.indexOf(s.items[+c.dataset.k].group),bucket=k=>$(`.bucket[data-k="${k}"]`);
  const finish=()=>{$('#ssay').innerHTML=fmt((s.result&&s.result.say)||s.say||'');$('#next').classList.toggle('glow',A);say('Sorted.','happy')};
  const board=dragDrop({items:$$('#tray .chip'),targets:$$('.bucket'),accepts:(c,b)=>groupOf(c)===+b.dataset.k,
    onDrop:(c,b)=>{b.querySelector('.pile').appendChild(c);if(++placed===s.items.length){$('#auto').hidden=true;const r=$('#res');if(r){r.disabled=false;r.classList.toggle('glow',A)}else finish()}},
    onReject:c=>{const it=s.items[+c.dataset.k];say(`${it.label} goes with ${it.group}.`,'sad')}});
  $('#auto').onclick=()=>{$('#auto').disabled=true;stagger($$('#tray .chip'),c=>board.place(c,bucket(groupOf(c))))};
  if(s.result)$('#res').onclick=()=>{$('#res').disabled=true;if(s.result.code&&$('#scode'))$('#scode').innerHTML=codeHTML(s.result.code);
    stagger($$('.bucket'),(b,k)=>{const v=(s.result.per_group||{})[groups[k]];if(v!==undefined){b.querySelector('.pile').hidden=true;b.querySelector('.res').innerHTML=`<div class="total">${esc(v)}</div>`}
      if(A)burst(...mid(b),20,5);sfx.crush();if(k===groups.length-1)finish()},420)};
}

// match: drag each item on the left onto its partner on the right; extras have no partner
function match(s,i){
  // several left items may share one partner (many orders, one customer), so partners are listed once
  enter();const names=[...new Set(s.pairs.map(p=>p.right))];
  const lefts=s.pairs.map(p=>({t:p.left,k:names.indexOf(p.right)})).concat(((s.extras||{}).left||[]).map(t=>({t,k:-1})));
  const order=VC.scramble(lefts.length,lefts.length+3).map(n=>lefts[n]);let placed=0;
  const rights=names.map((t,k)=>({t,k})).concat(((s.extras||{}).right||[]).map(t=>({t,k:-2})));
  h(tagOf(i,s)+lead(s)+`<p class="muted small">Drag each one onto its match, or tap it and then tap the match.${lefts.length>s.pairs.length?' Some have no match.':''}</p>
    <div class="matchgrid"><div><div class="small muted">${esc(s.left_title||'')}</div><div class="tray" id="tray">${order.map(x=>`<div class="chip" data-k="${x.k}">${fmt(x.t)}</div>`).join('')}</div></div>
    <div><div class="small muted">${esc(s.right_title||'')}</div><div class="slotcol">${rights.map(x=>`<div class="bucket" data-k="${x.k}">${fmt(x.t)}<div class="pile"></div></div>`).join('')}</div></div></div>
    <div class="row"><button class="btn ghost" id="auto">Do it for me</button></div><p class="muted" id="ssay"></p>`+navOf(i));
  const finish=()=>{$('#auto').hidden=true;$('#ssay').innerHTML=fmt(s.say||'');$('#next').classList.toggle('glow',A);say('All matched.','happy')};
  const board=dragDrop({items:$$('#tray .chip'),targets:$$('.bucket'),accepts:(c,b)=>+c.dataset.k>=0&&c.dataset.k===b.dataset.k,
    onDrop:(c,b)=>{b.querySelector('.pile').appendChild(c);b.classList.add('g1');if(++placed===s.pairs.length)finish()},
    onReject:c=>say(+c.dataset.k<0?'That one has no match. It stays behind.':'Not that one. Look again.','sad')});
  $('#auto').onclick=()=>{$('#auto').disabled=true;stagger($$('#tray .chip').filter(c=>+c.dataset.k>=0),c=>board.place(c,$(`.bucket[data-k="${c.dataset.k}"]`)))};
}

// flow: follow one thing as it moves through the parts of the system
function flow(s,i){
  enter();let n=0;
  h(tagOf(i,s)+lead(s)+`<div class="flow" id="flow">${s.nodes.map((x,k)=>`<div class="node" data-k="${k}"><b>${esc(x.label)}</b>${x.detail?`<small>${esc(x.detail)}</small>`:''}</div>`).join('<span class="arrow" aria-hidden="true">→</span>')}</div>
    <div id="packetbox"></div><p id="steptxt"></p><div class="dots" id="dots"></div>
    <div class="nav">${i>0?`<button class="btn ghost" data-go="${i-1}">Back</button>`:'<span></span>'}<button class="btn" id="nextStep" data-enter></button></div>`);
  const draw=()=>{const st=s.steps[n],seen=new Set(s.steps.slice(0,n).map(x=>x.at));
    $$('.node').forEach(el=>{const k=+el.dataset.k;el.classList.toggle('on',k===st.at);el.classList.toggle('done',seen.has(k))});
    $('#packetbox').innerHTML=st.value!==undefined?`<div class="packet">${fmt(st.value)}</div>`:'';
    $('#steptxt').innerHTML=fmt(st.text);$('#dots').innerHTML=s.steps.map((_,k)=>`<i class="${k<=n?'on':''}"></i>`).join('');
    $('#nextStep').textContent=n<s.steps.length-1?'Next step':(i===LESSON.length-1?'Quiz me':'Next');if(n>0)sfx.drop()};
  $('#nextStep').onclick=()=>{if(n<s.steps.length-1){n++;draw()}else go(i+1)};
  draw();
}

// slider: move one setting and watch what it selects or produces
function slider(s,i){
  enter();const P=s.positions,start=Math.min(P.length-1,Math.max(0,s.start||0));
  h(tagOf(i,s)+lead(s)+`<div class="slide"><span>${esc(s.label||'')}</span><input type="range" id="rng" min="0" max="${P.length-1}" value="${start}" aria-label="${esc(s.label||'value')}"><b id="rv"></b></div>
    <pre id="slcode" hidden></pre>${s.cells?`<div class="cells" id="cells">${s.cells.map((c,k)=>`<div class="cell"><small>${k}</small>${esc(c)}</div>`).join('')}</div>`:''}
    <p id="slsay"></p>`+navOf(i));
  const draw=()=>{const p=P[+$('#rng').value];$('#rv').textContent=p.label;$('#slcode').hidden=!p.code;$('#slcode').innerHTML=codeHTML(p.code||'');
    $$('#cells .cell').forEach((c,k)=>c.classList.toggle('on',(p.highlight||[]).includes(k)));$('#slsay').innerHTML=fmt(p.say||'')};
  $('#rng').oninput=()=>{sfx.tick();draw()};draw();
}

// build: put the pieces of a line of code in order
function build(s,i){
  enter();const all=s.pieces.map((t,k)=>({t,k})).concat((s.extras||[]).map(t=>({t,k:-1})));
  const pool=VC.scramble(all.length,all.length+5).map(n=>all[n]);let line=[];
  h(tagOf(i,s)+lead(s)+`<div class="line" id="line" aria-label="Your line"></div><div class="pool" id="pool"></div>
    <div class="row"><button class="btn ghost" id="show">Show me</button><button class="btn ghost" id="clear">Clear</button></div><p id="bsay" class="muted"></p>`+navOf(i));
  const draw=()=>{$('#line').innerHTML=line.map((p,k)=>`<button class="piece" data-at="${k}">${esc(pool[p].t)}</button>`).join('');
    $('#pool').innerHTML=pool.map((x,k)=>`<button class="piece" data-p="${k}" ${line.includes(k)?'disabled':''}>${esc(x.t)}</button>`).join('');
    const L=$('#line');L.classList.remove('wrongline','rightline');
    if(line.length>=s.pieces.length){const ok=line.length===s.pieces.length&&line.every((p,k)=>pool[p].k===k);
      L.classList.add(ok?'rightline':'wrongline');
      if(ok){$('#bsay').innerHTML=fmt(s.say||'That is the line.');sfx.good();if(A)burst(...mid(L),30,6);$('#next').classList.toggle('glow',A);say('Built it.','happy')}
      else{const bad=line.findIndex((p,k)=>pool[p].k!==k);$('#bsay').textContent=`Not quite. Look at piece ${bad+1}. Tap a piece in your line to take it out.`;sfx.nope()}}
    else $('#bsay').textContent=''};
  $('#pool').onclick=e=>{const p=e.target.dataset.p;if(p!==undefined&&!e.target.disabled){line.push(+p);sfx.click();draw()}};
  $('#line').onclick=e=>{const a=e.target.dataset.at;if(a!==undefined){line.splice(+a,1);draw()}};
  $('#clear').onclick=()=>{line=[];draw()};
  $('#show').onclick=()=>{line=s.pieces.map((_,k)=>pool.findIndex(x=>x.k===k));draw()};
  draw();
}

// compare: the data before and after one operation
function compare(s,i){
  enter();let after=false;
  h(tagOf(i,s)+lead(s)+(s.code?`<pre>${codeHTML(s.code)}</pre>`:'')+`<div class="controls"><div class="seg" id="ba"><button data-v="0">Before</button><button data-v="1">After</button></div></div>
    <div class="stage" id="stage"></div><p class="muted" id="csay"></p>`+navOf(i));
  const draw=first=>{$$('#ba button').forEach(b=>b.classList.toggle('on',(b.dataset.v==='1')===after));
    const put=()=>{$('#stage').innerHTML=rowsHTML(after?s.after:s.before)};first?put():flip($('#stage'),put);
    $('#csay').innerHTML=after?fmt(s.say||''):''};
  $('#ba').onclick=e=>{if(e.target.dataset.v!==undefined){after=e.target.dataset.v==='1';sfx.drop();draw()}};
  draw(true);
}

// A scene the agent wrote for this topic. It gets a small toolkit and can't break the quiz:
// if it throws, the page shows the scene's fallback instead, and Next always works.
function custom(s,i){
  enter();
  h(tagOf(i,s)+`<div id="custom">${s.html}</div>`+navOf(i));
  const next=$('#next');
  const api={root:$('#custom'),say,sfx,roll,flip,dragDrop,burst:(el,n=24,power=6)=>burst(...mid(el),n,power),
    calm:()=>calm,fmt,esc,done:(line)=>{next.classList.add('glow');if(line)say(line,'happy')}};
  if(s.js)new Function('vc',s.js)(api);
}

// ---------- quiz ----------
let quiz;
function startQuiz(){quiz=new VC.Quiz();setCombo(0);if(LESSON.length)say('Quiz time. Miss one and it comes back at the end.','',4000);showQ()}
function showQ(){
  const my=enter(),qi=quiz.index,q=quiz.question;progress(LESSON.length+1+qi);
  const tag=`<div class="tag">Check ${qi+1} of ${QN}${q.type==='expect'?': what do you expect?':''}${quiz.round>1?' (retry)':''}</div>`;
  if(q.type==='order'||q.type==='match'){
    const pairs=q.type==='match',items=pairs?q.pairs.map(p=>p.right):q.items;
    let cur=VC.scramble(items.length,qi+items.length);
    h(tag+`<h2>${fmt(q.prompt)}</h2>${q.code?`<pre>${codeHTML(q.code)}</pre>`:''}<p class="muted small">${pairs?'Move the right-hand side until every row is a match. Drag, or use the arrows.':'Drag, or use the arrows.'}</p><div class="drag" id="drag"></div><div id="fb"></div><div class="nav"><span></span><button class="btn" id="check" data-enter>${pairs?'Check matches':'Check order'}</button></div>`);
    const box=$('#drag');
    const draw=()=>{box.innerHTML=cur.map((it,k)=>`<div class="di" draggable="true" data-i="${k}" data-key="${it}">${pairs?`<span class="lft">${fmt(q.pairs[k].left)}</span>`:`<span class="n">${k+1}</span>`}<span class="t">${fmt(items[it])}</span><button class="mv" data-up="${k}" aria-label="Move up">↑</button><button class="mv" data-down="${k}" aria-label="Move down">↓</button></div>`).join('')};
    draw();let from=null;
    box.addEventListener('dragstart',e=>{const d=e.target.closest('.di');from=+d.dataset.i;d.classList.add('dragging')});
    box.addEventListener('dragend',()=>{from=null;draw()});
    box.addEventListener('dragover',e=>{e.preventDefault();const d=e.target.closest('.di');if(!d||from===null)return;const to=+d.dataset.i;
      if(to!==from){const [m]=cur.splice(from,1);cur.splice(to,0,m);from=to;draw();sfx.tick()}});
    box.addEventListener('click',e=>{const u=e.target.dataset.up,dn=e.target.dataset.down;
      if(u!==undefined&&+u>0){flip(box,()=>{[cur[+u-1],cur[+u]]=[cur[+u],cur[+u-1]];draw()});sfx.click()}
      if(dn!==undefined&&+dn<cur.length-1){flip(box,()=>{[cur[+dn+1],cur[+dn]]=[cur[+dn],cur[+dn+1]];draw()});sfx.click()}});
    $('#check').onclick=()=>{const ok=cur.every((v,k)=>v===k);
      box.querySelectorAll('.di').forEach((el,k)=>el.classList.add(cur[k]===k?'right':'wrong'));
      box.style.pointerEvents='none';answered(ok,qi,q,$('#check'),ok?'y':'n')};
    return;
  }
  const chat=A&&q.type==='explain',opts=q.type==='bug'?q.lines:q.options,mono=['predict','bug','fill'].includes(q.type);
  const optsHTML=`<div class="opts" id="opts">${opts.map((o,k)=>`<button class="opt" data-i="${k}"><kbd>${k+1}</kbd><span>${mono?'<pre>'+esc(o)+'</pre>':fmt(o)}</span></button>`).join('')}</div><div id="fb"></div><div class="nav" id="qnav"></div>`;
  if(chat){
    h(tag+`<div class="chat" id="chat"></div><p class="muted small" id="ask" hidden>Pick the reply you'd send:</p>`+optsHTML);
    $('#opts').hidden=true;
    (async()=>{await typing(my,700,q.from||'Sam');await bubble('them',q.prompt,my,q.from||'Sam');if(my!==scene)return;$('#ask').hidden=false;$('#opts').hidden=false})();
  }else{
    h(tag+`<h2>${fmt(q.prompt)}</h2>`+(q.code?(q.type==='predict'?`<pre class="term" id="term"><span class="pr">&gt;&gt;&gt; </span>${codeHTML(q.code)}<span class="out" id="out"></span><span class="cursor"></span></pre>`:`<pre>${codeHTML(q.code).replace('___','<span class="blank" id="blank">___</span>')}</pre>`):'')+optsHTML);
  }
  $('#opts').onclick=async e=>{
    const b=e.target.closest('.opt');if(!b||b.disabled)return;const k=+b.dataset.i,ok=k===q.answer;
    $$('.opt').forEach(x=>x.disabled=true);b.classList.add('picked');sfx.click();
    if(q.type==='predict'&&$('#out')){for(const line of String(opts[q.answer]).split('\n')){if(my!==scene)return;$('#out').textContent+='\n'+line;sfx.tick();await wait(300)}}
    if(chat){await bubble('me',opts[k],my);await typing(my,800,q.from||'Sam');
      await bubble('them',ok?(q.thanks||'Ohh, that makes sense. Thanks!'):'Hmm, I don\'t think that\'s it...',my,q.from||'Sam');
      if(my!==scene)return;const r=document.createElement('div');r.className='react';r.textContent=ok?'🙌':'🤔';$('#chat').appendChild(r)}
    if(my!==scene)return;
    b.classList.add(ok?'right':'wrong');if($('#blank'))$('#blank').textContent=opts[k];
    if(!ok)setTimeout(()=>{const c=$(`.opt[data-i="${q.answer}"]`);if(c)c.classList.add('right');if($('#blank'))$('#blank').textContent=opts[q.answer]},450);
    answered(ok,qi,q,b,String(k));
  };
}
const CHEER=['Yes. That\'s it.','Clean.','You\'re on a roll.','Exactly right.'],OOPS=['Close. Read the why, it comes back at the end.','Happens. The retry round has your back.'];
function answered(ok,qi,q,el,mark){
  const firstGo=quiz.trail[qi].length===0;quiz.record(qi,mark,ok);
  if(ok){setCombo(combo+1);addXP(firstGo?20:10,el);if(A)burst(...mid(el),44,8);sfx.good();say(CHEER[Math.floor(Math.random()*CHEER.length)],'happy')}
  else{setCombo(0);sfx.bad();say(OOPS[Math.floor(Math.random()*OOPS.length)],'sad');
    if(A&&!calm){const w=$('#wrap');w.classList.remove('quake');void w.offsetWidth;w.classList.add('quake')}}
  const exp=q.type==='expect',fb=$('#fb');fb.className='fb '+(ok?'good':'bad');
  fb.innerHTML=(ok?(exp?'<b>That\'s what the code does.</b> ':'<b>Nailed it.</b> '):(exp?'<b>The code does something else.</b> ':'<b>Not quite.</b> '))+fmt(q.why)
    +(q.source?` <span class="muted small">(${esc(q.source)})</span>`:'')
    +(!ok&&q.type!=='order'&&q.type!=='match'?'<div style="margin-top:10px"><button class="pill" id="dispute">That\'s not what it should do</button></div>':'');
  // A dispute is a possible bug in the code, not a miss: it is logged and doesn't count against the user.
  if($('#dispute'))$('#dispute').onclick=()=>{quiz.dispute(qi);addXP(firstGo?20:10,$('#dispute'));
    fb.className='fb';fb.style.border='1px solid var(--line)';
    fb.innerHTML='<b>Logged as a possible issue.</b> It doesn\'t count against you. Claude will check the code against what you expected and report back.';
    say('Good catch, maybe. Flagged it.','happy');sfx.click()};
  const nav=$('.nav');nav.innerHTML=`<span></span><button class="btn${A?' glow':''}" id="nextQ" data-enter>Next</button>`;
  $('#nextQ').onclick=()=>{
    const what=quiz.next();
    if(what==='question')return showQ();
    if(what==='done')return win();
    enter();const one=quiz.queue.length===1;
    h(`<div class="tag">Round ${quiz.round}</div><h2>Almost. Let's retry the ${one?'one':'ones'} you missed.</h2><p class="muted">You've seen the explanation now. Get ${one?'it':'them'} right to ${D.review?'finish':'open the gate'}.</p><div class="nav"><span></span><button class="btn${A?' glow':''}" id="again" data-enter>Let's go</button></div>`);
    $('#again').onclick=showQ;
  };
}

// ---------- win ----------
async function win(){
  const my=enter();progress(TOTAL);
  const code=VC.passCode(),badge=esc(D.badge||'🧩');
  const inside=`<div class="center">
      <div class="tag">${D.review?'Review complete':D.gate===false?'Lesson complete':'Vee Check passed'}</div>
      <div class="${A?'coin':'badge'}">${badge}</div>
      <h2>${D.review?'':'Badge unlocked: '}<code>${esc(D.topic)}</code></h2>
      <div class="statrow">
        <div class="stat"><b id="sxp">${EARN?0:'–'}</b><small>XP earned</small></div>
        <div class="stat"><b>${quiz.firstTry()}/${QN}</b><small>first try</small></div>
        <div class="stat"><b>${A?'x'+Math.max(1,best):quiz.right.size+'/'+QN}</b><small>${A?'best combo':'correct'}</small></div>
      </div>
      ${D.review?'<p>Nothing to paste. You can close this page.</p>':`<p>Copy this code and paste it into Claude Code to ${D.gate===false?'save this to your Learning Log':'unlock the build'}:</p>
      <div class="code" id="code" aria-label="Pass code">${A?'•••••••••':esc(code)}</div><br>`}
      <div class="row">${D.review?'':`<button class="btn${A?' glow':''}" id="copy" data-enter>Copy code</button>`}<button class="btn ghost" id="replay">Replay</button></div>
      ${D.review?'':'<p class="muted small">Copy includes a short record of your answers for your Learning Log.</p>'}
    </div>`;
  h((A?'<div class="door dl"></div><div class="door dr"></div><div class="lock">🔒</div>':'')+inside,A?'vault':'');
  $('#replay').onclick=()=>{setCombo(0);A?splash():go(0)};
  if(!D.review)$('#copy').onclick=()=>{const c=$('#copy');burst(...mid(c),30,6);sfx.good();VC.copy(quiz.resultCode(),c,'Copied ✓')};
  const reward=()=>{addXP(50,$('.coin,.badge'));if(EARN){roll($('#sxp'),0,gained,1000);
    if(base.streak!==undefined){$('#streak').textContent=(base.streak||0)+(D.stats&&D.stats.passed_today?0:1)}}};
  if(!A){reward();if(!calm){for(let k=0;k<3;k++)setTimeout(()=>burst(W*(.25+k*.25),H*.3,40,8),k*250)}return}
  const v=$('.vault');
  await wait(350);if(my!==scene)return;v.classList.add('unlock');sfx.crush();
  await wait(650);if(my!==scene)return;v.classList.add('open');sfx.level();reward();
  say(D.review?'Nicely revised.':D.gate===false?'Done. Paste the code to log it.':'Gate\'s open. Go paste that code.','happy',6000);
  if(!calm){let n=0;const fw=setInterval(()=>{if(my!==scene||++n>11)return clearInterval(fw);burst(W*(.15+Math.random()*.7),H*(.12+Math.random()*.4),60,9)},380)}
  const el=$('#code');if(!el)return;
  if(calm){el.textContent=code;return}
  const CH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let shownN=0,ticks=0;
  const sc=setInterval(()=>{if(my!==scene)return clearInterval(sc);
    if(++ticks%4===0){shownN++;sfx.tick()}
    el.textContent=[...code].map((c,k)=>k<shownN||c==='-'?c:CH[Math.floor(Math.random()*CH.length)]).join('');
    if(shownN>=code.length){clearInterval(sc);el.textContent=code}},45);
}

// ---------- keyboard: 1-9 answer, Enter continues ----------
addEventListener('keydown',e=>{
  const t=e.target instanceof Element?e.target:document.body;
  if(t.matches('input,textarea,select'))return;
  if(/^[1-9]$/.test(e.key)){const o=$$('.opt')[+e.key-1];if(o&&!o.disabled&&$('#opts')&&!$('#opts').hidden)o.click()}
  if(e.key==='Enter'&&!t.closest('button,[role=button]')){const b=$('[data-enter]:not(:disabled)');if(b){e.preventDefault();b.click()}}
});

A?splash():go(0);
})();
</script>
